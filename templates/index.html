<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trade Radar</title><style>*{box-sizing:border-box}body{margin:0;background:#090d14;color:#fff;font-family:Arial,sans-serif}.app{max-width:900px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;align-items:center}h1{margin:0}header p{color:#8e9aad}.badge{padding:10px 14px;border-radius:12px;font-weight:800}.running{background:#123b2b;color:#49dc91}.stopped{background:#411c25;color:#ff6b7e}.notice,.controls,.strategy-box,.summary,.card,.empty{background:#131923;border:1px solid #252e3c;border-radius:15px}.notice{padding:14px;margin:14px 0;color:#c7d0de;font-size:13px;line-height:1.6}.controls{padding:14px;display:grid;grid-template-columns:1fr 1fr auto auto;gap:10px;align-items:end}.controls label{display:block;color:#9ba7b8;font-size:12px;margin-bottom:6px}select,input{width:100%;padding:11px;border-radius:9px;border:1px solid #303b4d;background:#0b1018;color:#fff}button{padding:12px 16px;border:0;border-radius:10px;background:#5269ff;color:#fff;font-weight:800}.secondary{background:#29313f}.strategy-box{display:flex;gap:14px;flex-wrap:wrap;padding:14px;margin-top:12px;color:#bdc6d5}.strategy-box input{width:auto}.summary{margin:12px 0;padding:12px;display:flex;justify-content:space-between;color:#94a0b2}.cards{display:grid;gap:12px}.card{padding:18px}.top{display:flex;justify-content:space-between}.pair{font-size:22px;font-weight:800}.score{font-size:20px;font-weight:800}.direction{display:inline-block;margin-top:12px;padding:8px 12px;border-radius:9px;font-weight:900}.up{background:#123b2b;color:#4ae19a}.down{background:#431d25;color:#ff7183}.reason{display:inline-block;background:#0c1119;border:1px solid #273142;border-radius:8px;padding:6px 8px;margin:8px 5px 0 0;font-size:12px}.mode{margin-top:12px;color:#ffca68;font-size:11px;font-weight:800}.empty{padding:35px;text-align:center;color:#7f8a9b}@media(max-width:650px){.controls{grid-template-columns:1fr 1fr}.summary{display:block}}</style></head><body><div class="app"><header><div><h1>TRADE RADAR</h1><p>Top 3 setups only</p></div><div id="statusBadge" class="badge stopped">STOPPED</div></header><div class="notice"><b>Market feed:</b> <span id="source"></span><br>SIMULATION signals are interface tests only — not live recommendations.</div><section class="controls"><div><label>Timeframe</label><select id="timeframe"><option value="300">5 Minutes</option><option value="60">1 Minute</option></select></div><div><label>Minimum score</label><input id="minScore" type="number" value="75"></div><button onclick="startRadar()">START RADAR</button><button class="secondary" onclick="stopRadar()">STOP</button></section><section class="strategy-box"><label><input type="checkbox" id="ema" checked> EMA 20/50</label><label><input type="checkbox" id="rsi" checked> RSI</label><label><input type="checkbox" id="bollinger" checked> Bollinger</label><label><input type="checkbox" id="candles" checked> Candles</label><label><input type="checkbox" id="levels" checked> Support / Resistance</label></section><div class="summary"><span>Scanned: <b id="scanned">0</b></span><span>Last scan: <b id="lastScan">—</b></span></div><main id="cards" class="cards"><div class="empty">Start Radar to scan.</div></main></div><script>const $=id=>document.getElementById(id);function cfg(){return{timeframe:+$("timeframe").value,min_score:+$("minScore").value,strategies:{ema:$("ema").checked,rsi:$("rsi").checked,bollinger:$("bollinger").checked,candles:$("candles").checked,levels:$("levels").checked}}}async function post(u,b){return(await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:b?JSON.stringify(b):null})).json()}async function startRadar(){await post("/api/config",cfg());await post("/api/start");refresh()}async function stopRadar(){await post("/api/stop");refresh()}function render(s){$("source").textContent=s.source;$("scanned").textContent=s.scanned||0;$("lastScan").textContent=s.last_scan?new Date(s.last_scan).toLocaleTimeString():"—";let b=$("statusBadge");b.textContent=s.running?"SCANNING":"STOPPED";b.className="badge "+(s.running?"running":"stopped");$("cards").innerHTML=s.opportunities?.length?s.opportunities.map((o,i)=>`<article class="card"><div class="top"><div class="pair">#${i+1} ${o.pair}</div><div class="score">${o.score}%</div></div><div class="direction ${o.direction==="UP"?"up":"down"}">${o.direction==="UP"?"↑ UP":"↓ DOWN"}</div><div>Expiry: ${o.timeframe}</div><div>${o.reasons.map(x=>`<span class="reason">${x}</span>`).join("")}</div><div class="mode">${o.data_mode}</div></article>`).join(""):'<div class="empty">No setup meets the minimum score.</div>'}async function refresh(){try{render(await(await fetch("/api/status")).json())}catch(e){}}refresh();setInterval(refresh,5000);</script></body></html>
