<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trade Radar</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090d14;color:#fff;font-family:-apple-system,"Segoe UI",Arial,sans-serif}
.app{max-width:900px;margin:auto;padding:18px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{margin:0;font-size:28px;letter-spacing:.5px}
header p{color:#8e9aad;margin:4px 0 0}
.badge{padding:10px 14px;border-radius:12px;font-weight:800;white-space:nowrap}
.running{background:#123b2b;color:#49dc91}
.stopped{background:#411c25;color:#ff6b7e}
.notice,.controls,.strategy-box,.summary,.card,.empty{background:#131923;border:1px solid #252e3c;border-radius:15px}
.notice{padding:14px;margin:14px 0;color:#c7d0de;font-size:13px;line-height:1.6}
.status-line{margin-top:6px;color:#ffca68;font-weight:700}
.quota{margin-top:4px;color:#8e9aad;font-size:12px}
.full{grid-column:1/-1}
.controls{padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.controls label{display:block;color:#9ba7b8;font-size:12px;margin-bottom:6px}
select,input{width:100%;padding:11px;border-radius:9px;border:1px solid #303b4d;background:#0b1018;color:#fff;font-size:16px}
button{padding:13px 16px;border:0;border-radius:10px;background:#5269ff;color:#fff;font-weight:800;font-size:15px;-webkit-appearance:none;appearance:none;cursor:pointer}
button:disabled{opacity:.5}
.secondary{background:#29313f}
.strategy-box{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px;margin-top:12px;color:#bdc6d5}
.strategy-box label{display:flex;align-items:center;gap:8px}
.strategy-box input{width:18px;height:18px;margin:0}
.summary{margin:12px 0;padding:12px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;color:#94a0b2}
.cards{display:grid;gap:12px}
.card{padding:18px}
.top{display:flex;justify-content:space-between;align-items:center}
.pair{font-size:22px;font-weight:800}
.score{font-size:20px;font-weight:800}
.direction{display:inline-block;margin-top:12px;padding:8px 12px;border-radius:9px;font-weight:900}
.up{background:#123b2b;color:#4ae19a}
.down{background:#431d25;color:#ff7183}
.meta{margin-top:10px;color:#9ba7b8;font-size:13px}
.reason{display:inline-block;background:#0c1119;border:1px solid #273142;border-radius:8px;padding:6px 8px;margin:8px 5px 0 0;font-size:12px}
.mode{margin-top:12px;color:#4ae19a;font-size:11px;font-weight:800}
.empty{padding:35px;text-align:center;color:#7f8a9b}
</style>
</head>
<body>
<div class="app">
  <header>
    <div><h1>TRADE RADAR</h1><p>Pocket Option · Top 3 setups</p></div>
    <div id="statusBadge" class="badge stopped">STOPPED</div>
  </header>

  <div class="notice">
    <b>Market feed:</b> <span id="source">—</span>
    <div id="statusText" class="status-line">Ready</div>
    <div id="quota" class="quota"></div>
  </div>

  <section class="controls">
    <div class="full"><label>Market</label>
      <select id="mode"><option value="otc">Pocket Option OTC (manual scan)</option><option value="real">Real market pairs (auto scan)</option></select></div>
    <div><label>Timeframe</label>
      <select id="timeframe"><option value="300">5 Minutes</option><option value="60">1 Minute</option></select></div>
    <div><label>Minimum score</label><input id="minScore" type="number" min="50" max="100" value="75"></div>
    <button id="startBtn" onclick="startRadar()">START RADAR</button>
    <button class="secondary" onclick="stopRadar()">STOP</button>
  </section>

  <section class="strategy-box">
    <label><input type="checkbox" id="ema" checked> EMA 20/50</label>
    <label><input type="checkbox" id="rsi" checked> RSI</label>
    <label><input type="checkbox" id="bollinger" checked> Bollinger</label>
    <label><input type="checkbox" id="candles" checked> Candles</label>
    <label><input type="checkbox" id="levels" checked> Support / Resistance</label>
  </section>

  <div class="summary">
    <span>Scanned: <b id="scanned">0</b></span>
    <span>Last scan: <b id="lastScan">—</b></span>
  </div>

  <main id="cards" class="cards"><div class="empty">Press the button to scan.</div></main>
</div>

<script>
const $ = id => document.getElementById(id);

function cfg(){
  return {
    mode: $("mode").value,
    timeframe: +$("timeframe").value,
    min_score: +$("minScore").value,
    strategies: {ema:$("ema").checked, rsi:$("rsi").checked, bollinger:$("bollinger").checked,
                 candles:$("candles").checked, levels:$("levels").checked}
  };
}

async function post(url, body){
  const r = await fetch(url, {method:"POST", headers:{"Content-Type":"application/json"},
                              body: body ? JSON.stringify(body) : null});
  return r.json();
}

async function startRadar(){
  const btn = $("startBtn");
  btn.disabled = true; btn.textContent = "SCANNING…";
  $("statusText").textContent = "Fetching live candles…";
  try { await post("/api/config", cfg()); await post("/api/start"); }
  catch(e){ $("statusText").textContent = "Connection error: " + e.message; }
  btn.disabled = false; setButton();
  refresh();
}

async function stopRadar(){ await post("/api/stop"); refresh(); }

// أي تغيير في الإعدادات أثناء التشغيل يتطبّق فورًا
function setButton(){
  $("startBtn").textContent = $("mode").value === "otc" ? "SCAN NOW" : "START RADAR";
}
$("mode").addEventListener("change", setButton);

["mode","timeframe","minScore","ema","rsi","bollinger","candles","levels"].forEach(id =>
  $(id).addEventListener("change", () => post("/api/config", cfg())));

let synced = false;
function render(s){
  if (!synced){ $("mode").value = s.mode; $("timeframe").value = s.timeframe; $("minScore").value = s.min_score;
    for (const k in s.strategies) $(k).checked = s.strategies[k]; setButton(); synced = true; }
  $("source").textContent = s.source;
  $("quota").textContent = s.mode === "otc" && s.quota_text ? s.quota_text : "";
  $("statusText").textContent = s.status + (s.failed ? ` (${s.failed} pairs failed)` : "");
  $("scanned").textContent = s.scanned || 0;
  $("lastScan").textContent = s.last_scan ? new Date(s.last_scan).toLocaleTimeString() : "—";
  const b = $("statusBadge");
  const live = s.running || (s.mode === "otc" && s.last_scan);
  b.textContent = s.running ? "SCANNING" : (live ? "READY" : "STOPPED");
  b.className = "badge " + (live ? "running" : "stopped");

  if (!s.last_scan){ $("cards").innerHTML = '<div class="empty">Press the button to scan.</div>'; return; }
  if (s.market_open === false){ $("cards").innerHTML = '<div class="empty">Market closed — regular pairs resume when forex opens.</div>'; return; }

  $("cards").innerHTML = s.opportunities && s.opportunities.length
    ? s.opportunities.map((o,i) => `
      <article class="card">
        <div class="top"><div class="pair">#${i+1} ${o.pair}</div><div class="score">${o.score}%</div></div>
        <div class="direction ${o.direction==="UP"?"up":"down"}">${o.direction==="UP"?"↑ UP":"↓ DOWN"}</div>
        <div class="meta">Expiry: ${o.timeframe} · Price: ${o.price}</div>
        <div>${o.reasons.map(x=>`<span class="reason">${x}</span>`).join("")}</div>
        <div class="mode">${o.data_mode}</div>
      </article>`).join("")
    : '<div class="empty">No setup meets the minimum score right now.</div>';
}

async function refresh(){
  try { render(await (await fetch("/api/status")).json()); } catch(e){}
}

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
