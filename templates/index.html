<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trade Radar</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#071019;color:#edf6ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.app{max-width:900px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;align-items:center}.head h1{margin:0;font-size:28px}.muted{color:#8292a5}.badge{padding:10px 14px;border-radius:14px;background:#123d2d;color:#50e3a0;font-weight:900}.panel{background:#101923;border:1px solid #233244;border-radius:18px;padding:15px;margin-top:14px}.radarWrap{display:grid;place-items:center;padding:18px 0}.radar{width:min(78vw,390px);aspect-ratio:1;border-radius:50%;position:relative;overflow:hidden;border:2px solid #1c9c6b;background:radial-gradient(circle,#0b2b25 0 2%,transparent 2.5%),repeating-radial-gradient(circle,transparent 0 19%,#164b3d 20%,transparent 20.7%),linear-gradient(90deg,transparent 49.7%,#164b3d 50%,transparent 50.3%),linear-gradient(transparent 49.7%,#164b3d 50%,transparent 50.3%),#071612;box-shadow:0 0 35px #0c6a4a44 inset}.sweep{position:absolute;inset:50% 50% 0 0;transform-origin:100% 0;background:linear-gradient(25deg,transparent 45%,#48f2ad55);animation:spin 3s linear infinite}.stopped .sweep{animation-play-state:paused}@keyframes spin{to{transform:rotate(360deg)}}.blip{position:absolute;z-index:4;text-align:center;background:#071019e8;border:1px solid #44e3a0;border-radius:10px;padding:6px 8px;width:112px;min-height:58px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 0 12px #0b9d6b33}.blip b{font-size:14px;line-height:1.1}.blip .small{font-size:9px;margin-top:2px}.blip .countdown{font-size:12px;font-weight:800;color:#ffc65c;margin-top:3px;font-variant-numeric:tabular-nums}.blip1{left:50%;top:28%;transform:translate(-50%,-50%)}.blip2{left:29%;top:65%;transform:translate(-50%,-50%)}.blip3{left:71%;top:65%;transform:translate(-50%,-50%)}.scanmsg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;text-align:center;color:#7fbea8;font-size:11px;pointer-events:none}.up{color:#50e3a0}.down{color:#ff6f83}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{font-size:12px;color:#8fa0b4}select,input{width:100%;margin-top:5px;padding:12px;border:1px solid #304258;border-radius:10px;background:#08111b;color:#fff;font-size:16px}button{border:0;border-radius:11px;padding:13px;background:#5269ff;color:#fff;font-weight:900;font-size:15px}.secondary{background:#293546}.inds{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:10px}.inds label{font-size:15px}.inds input{width:18px;height:18px;margin:0 7px 0 0}.stats{display:flex;justify-content:space-around;text-align:center}.stats b{display:block;font-size:22px}.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1;background:#172434}.tabs button.active{background:#235d49}.row{padding:12px 0;border-bottom:1px solid #223143}.row:last-child{border:0}.rowTop{display:flex;justify-content:space-between;font-weight:800}.small{font-size:12px;color:#8fa0b4;margin-top:5px}.win{color:#50e3a0}.loss{color:#ff6f83}.draw{color:#ffc65c}.empty{text-align:center;color:#7f90a3;padding:20px}.status{color:#ffc65c;font-size:13px;line-height:1.5}.notifyRow{display:flex;align-items:center;justify-content:space-between;gap:12px}.notifyBtn{width:auto;padding:10px 14px;background:#293546}.notifyBtn.on{background:#235d49;color:#50e3a0}
</style></head><body><div class="app">
<div class="head"><div><h1>TRADE RADAR</h1><div class="muted">Pocket Option · verified consensus signals</div></div><div id="badge" class="badge">STOPPED</div></div>
<div class="panel radarWrap"><div id="radar" class="radar stopped"><div class="sweep"></div><div id="scanmsg" class="scanmsg">SCANNING</div><div id="blip1" class="blip blip1" style="display:none"></div><div id="blip2" class="blip blip2" style="display:none"></div><div id="blip3" class="blip blip3" style="display:none"></div></div></div>
<div class="panel"><div><b>Market feed:</b> <span id="source">—</span></div><div id="status" class="status">Ready</div></div><div class="panel notifyRow"><div><b>Screen notifications</b><div id="notifyState" class="small">Off · maximum 3 signal alerts per scan</div></div><button id="notifyBtn" class="notifyBtn" onclick="toggleNotifications()">TURN ON</button></div>
<div class="panel controls"><div class="full"><label>Market<select id="mode"><option value="otc">Pocket Option OTC</option><option value="real">Real market pairs</option></select></label></div><div><label>Timeframe<select id="timeframe" disabled><option value="300">5 Minutes</option></select></label></div><div><label>Minimum agreement<input id="minScore" type="number" min="40" max="100" value="65"></label></div><button onclick="startRadar()">START RADAR</button><button class="secondary" onclick="stopRadar()">STOP</button></div>
<div class="panel"><div><b>Indicators</b> <span class="muted">— signal appears only when ALL selected indicators agree</span></div><div id="indicators" class="inds"></div></div>
<div class="panel stats"><div><b id="closed">0</b><span class="muted">Closed</span></div><div><b id="wins">0</b><span class="muted">Wins</span></div><div><b id="losses">0</b><span class="muted">Losses</span></div><div><b id="wr">—</b><span class="muted">Win rate</span></div></div>
<div class="panel"><div class="tabs"><button id="tabOpen" class="active" onclick="showTab('open')">Current signals</button><button id="tabClosed" onclick="showTab('closed')">Results</button></div><div id="log"></div></div>
</div><script>
const $=x=>document.getElementById(x);let names={},built=false,lastState=null,tab='open';
let pushConfig=null;
function b64ToU8(s){let p='='.repeat((4-s.length%4)%4),b=(s+p).replace(/-/g,'+').replace(/_/g,'/'),r=atob(b),a=new Uint8Array(r.length);for(let i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a}
async function updateNotifyUI(){let btn=$('notifyBtn'),st=$('notifyState');if(!('serviceWorker'in navigator)||!('PushManager'in window)){btn.disabled=true;st.textContent='Not supported in this browser';return}pushConfig=await fetch('/api/push/config').then(r=>r.json()).catch(()=>null);if(!pushConfig?.enabled){btn.disabled=true;st.textContent='Server push keys need configuration';return}let reg=await navigator.serviceWorker.register('/sw.js'),sub=await reg.pushManager.getSubscription();btn.disabled=false;btn.textContent=sub?'TURN OFF':'TURN ON';btn.className='notifyBtn '+(sub?'on':'');st.textContent=sub?'On · alerts only for new qualifying signals (max 3 per scan)':'Off · maximum 3 signal alerts per scan'}
async function toggleNotifications(){try{let reg=await navigator.serviceWorker.register('/sw.js'),sub=await reg.pushManager.getSubscription();if(sub){await fetch('/api/push/unsubscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(sub)});await sub.unsubscribe()}else{let perm=await Notification.requestPermission();if(perm!=='granted')return updateNotifyUI();sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToU8(pushConfig.public_key)});let r=await fetch('/api/push/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(sub)});if(!r.ok){await sub.unsubscribe();throw new Error('subscribe failed')}}await updateNotifyUI()}catch(e){$('notifyState').textContent='Could not enable notifications'}}

function strategies(){let o={};for(const k in names)o[k]=$("i_"+k).checked;return o}function cfg(){return{mode:$("mode").value,timeframe:300,min_score:+$("minScore").value,strategies:strategies()}}async function post(u,b){return(await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):null})).json()}async function startRadar(){await post('/api/config',cfg());await post('/api/start');refresh()}async function stopRadar(){await post('/api/stop');refresh()}
function build(s){names=s.indicator_names;$('indicators').innerHTML=Object.entries(names).map(([k,n])=>`<label><input type="checkbox" id="i_${k}" ${s.strategies[k]?'checked':''}>${n}</label>`).join('');for(const k in names)$("i_"+k).onchange=()=>post('/api/config',cfg());$('mode').value=s.mode;$('timeframe').value=300;$('minScore').value=s.min_score;['mode','minScore'].forEach(x=>$(x).onchange=()=>post('/api/config',cfg()));built=true}
function dt(x){return x?new Date(x*1000).toLocaleString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'}):'—'}function showTab(x){tab=x;$('tabOpen').className=x==='open'?'active':'';$('tabClosed').className=x==='closed'?'active':'';if(lastState)renderLog(lastState)}
function renderLog(s){let now=Date.now()/1000;let rows=(s.signals||[]).filter(x=>tab==='open'?(x.status==='OPEN'&&x.expires_at>now):x.status==='CLOSED');$('log').innerHTML=rows.length?rows.map(x=>`<div class="row"><div class="rowTop"><span>${x.pair} · <span class="${x.direction==='UP'?'up':'down'}">${x.direction==='UP'?'↑ UP':'↓ DOWN'}</span></span><span class="${x.result==='WIN'?'win':x.result==='LOSS'?'loss':'draw'}">${x.result||x.score+'%'}</span></div><div class="small">Start ${dt(x.opened_at)} · Entry ${x.entry} · Expiry ${dt(x.expires_at)}${x.exit!=null?' · Close '+x.exit:''}</div><div class="small">Feed: ${x.mode==='otc'?'Pocket OTC / OTCharts':'Yahoo reference market'} · ${(x.reasons||[]).join(' · ')}</div></div>`).join(''):'<div class="empty">No records yet.</div>'}
function left(expires){let n=Math.max(0,Math.ceil(expires-Date.now()/1000)),m=Math.floor(n/60),q=n%60;return String(m).padStart(2,'0')+':'+String(q).padStart(2,'0')}function tickCountdowns(){document.querySelectorAll('[data-expires]').forEach(el=>el.textContent=left(+el.dataset.expires))}
function render(s){lastState=s;if(!built)build(s);$('source').textContent=s.source;$('status').textContent=s.status+(s.budget_note?' · '+s.budget_note:'');$('badge').textContent=s.running?'AUTO':'STOPPED';$('radar').className='radar '+(s.running?'':'stopped');let open=(s.signals||[]).filter(x=>x.status==='OPEN');let ops=(s.opportunities||[]).slice(0,3);for(let i=1;i<=3;i++){let el=$('blip'+i),o=ops[i-1];if(o){let sig=open.find(x=>x.pair===o.pair&&x.direction===o.direction),exp=sig?sig.expires_at:(Date.now()/1000+(+s.timeframe||300));el.style.display='flex';el.innerHTML=`<b>${o.pair}</b><div class="${o.direction==='UP'?'up':'down'}">${o.direction==='UP'?'↑':'↓'} · ${o.score}%</div><div class="countdown" data-expires="${exp}">${left(exp)}</div>`}else el.style.display='none'}$('scanmsg').style.display=ops.length?'none':'block';let p=s.performance||{};$('closed').textContent=p.closed||0;$('wins').textContent=p.wins||0;$('losses').textContent=p.losses||0;$('wr').textContent=p.win_rate==null?'—':p.win_rate+'%';renderLog(s);tickCountdowns()}async function refresh(){try{render(await(await fetch('/api/status')).json())}catch(e){}}refresh();updateNotifyUI();setInterval(refresh,3000);setInterval(tickCountdowns,1000);
</script></body></html>
