<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trade Radar</title><link rel="stylesheet" href="/static/style.css"></head><body><div class="app"><header><div><h1>TRADE RADAR</h1><p>Top 3 setups only</p></div><div id="statusBadge" class="badge stopped">STOPPED</div></header><div class="notice"><b>Market feed:</b> <span id="source"></span><br>SIMULATION signals are interface tests only — not live recommendations.</div><section class="controls"><div><label>Timeframe</label><select id="timeframe"><option value="300">5 Minutes</option><option value="60">1 Minute</option></select></div><div><label>Minimum score</label><input id="minScore" type="number" value="75"></div><button onclick="startRadar()">START RADAR</button><button class="secondary" onclick="stopRadar()">STOP</button></section><section class="strategy-box"><label><input type="checkbox" id="ema" checked> EMA 20/50</label><label><input type="checkbox" id="rsi" checked> RSI</label><label><input type="checkbox" id="bollinger" checked> Bollinger</label><label><input type="checkbox" id="candles" checked> Candles</label><label><input type="checkbox" id="levels" checked> Support / Resistance</label></section><div class="summary"><span>Scanned: <b id="scanned">0</b></span><span>Last scan: <b id="lastScan">—</b></span></div><main id="cards" class="cards"><div class="empty">Start Radar to scan.</div></main></div><script src="/static/app.js"></script></body></html>
